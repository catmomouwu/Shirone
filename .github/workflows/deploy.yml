# 双仓部署：内容仓推送 -> 本仓库重新构建 -> FTP 上传虚拟主机。
#
# 由 .github/workflows/deploy.yml.example 启用：
#   - CONTENT_REPOSITORY 已替换为 catmomouwu/shirone-content；
#   - Deploy 步骤替换为 lftp mirror（与本地 ftpdeploy.sh 行为一致）。
#
# 所需 Secrets（Settings > Secrets and variables > Actions）：
#   - CONTENT_REPO_TOKEN：读取私有内容仓的令牌（Contents: Read）；
#   - FTP_HOST / FTP_USER / FTP_PASS：虚拟主机 FTP 凭据；
#   - FTP_PORT / FTP_REMOTE_DIR：可选（默认 21 与站点根目录 .）；
#   - BILI_SESSDATA：可选，构建期刷新 B 站番剧数据。

name: Deploy

on:
  # 代码变更。
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "rules/**"
      - "README*.md"
      - "*.md"
  # 内容仓推送后由 trigger-build.yml 发来的事件。
  repository_dispatch:
    types: [content-updated]
  # 手动触发；回滚时把 content_ref 填成旧的内容 SHA。
  workflow_dispatch:
    inputs:
      content_ref:
        description: "内容仓 ref 或 commit SHA（留空使用 main）"
        required: false
        default: ""
  # 兜底：repository_dispatch 事件偶尔会丢，每天重建一次保证最终一致。
  schedule:
    - cron: "17 4 * * *"

# 并发控制：同一时间只允许一个部署流水线运行。
# 无论是代码仓代码推送（push）还是内容仓触发（repository_dispatch），
# 均归入同一个 deploy 并发通道。新的构建请求会自动取消正在运行中的旧构建，
# 确保始终以最新一次提交（最新代码 + 最新内容）为准，杜绝并发竞争。
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONTENT_REPOSITORY: catmomouwu/shirone-content
  CONTENT_WORKING_COPY: .content-src

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # 让 content:sync 走「本地目录」模式，内容由下面的 checkout 步骤取得。
      CONTENT_DIR: .content-src

    steps:
      - name: Resolve content ref
        id: target
        # 经 env 传递而不是直接内插到脚本里：client_payload 属于外部输入，
        # 直接内插会形成 shell 注入面。
        env:
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_REF: ${{ github.event.inputs.content_ref }}
        run: |
          set -euo pipefail
          ref="${PAYLOAD_SHA:-}"
          [ -n "$ref" ] || ref="${INPUT_REF:-}"
          [ -n "$ref" ] || ref="main"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout theme
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout content
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ env.CONTENT_REPOSITORY }}
          ref: ${{ steps.target.outputs.ref }}
          path: ${{ env.CONTENT_WORKING_COPY }}
          # 内容仓为私有仓库，必须提供只读令牌。
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Record content commit
        id: content
        run: |
          set -euo pipefail
          echo "sha=$(git -C '${{ env.CONTENT_WORKING_COPY }}' rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # No `version` on purpose: the action then reads `packageManager`
          # from this project's package.json, which `shirones init` pins from
          # the theme. Spelling it out here is what made the two disagree
          # (9.14.4 vs pnpm@11.28.2) and failed the whole setup step.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore build caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # 缩略图按源图内容哈希复用，跨 commit 的缓存命中安全且有效；
          # 内容层存储（.astro / node_modules/.astro）不跨 commit 缓存，避免集合清空后旧条目残留。
          path: |
            public/assets/moments/thumbnails
          key: ${{ runner.os }}-shirone-thumbnails-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-thumbnails-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # 独立成步，而不是依赖 `pnpm build` 内部再跑一次：
      # 内容问题（含 config/*.yaml 的类型校验）与构建问题因此在日志里天然分开，
      # 且 fonts:subset 需要内容与配置都已就位。
      - name: Materialize content and config
        run: pnpm content:sync

      # 番剧数据与封面：缓存 + 按需刷新。
      # 未配置 provider 时，anime:sync 会自动跳过并 exit 0。
      - name: Restore anime cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            src/data/anime-snapshots
            public/assets/anime/covers
          key: ${{ runner.os }}-shirone-anime-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-shirone-anime-

      - name: Sync anime data (best effort)
        run: pnpm anime:sync --if-stale
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      - name: Build site
        run: pnpm build
        env:
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}

      # FTP 上传虚拟主机（与本地 ftpdeploy.sh 等价：lftp mirror --reverse）。
      # mirror:size-only：只按文件大小判定差异。FTP 服务器存不住构建时间戳，
      # 默认的「大小+时间」比对会让每次全量重传；Astro 构建是确定性的，
      # 内容不变的产物字节与大小完全一致，即可跳过，实现增量上传。
      # --parallel=8：并行传输 8 个文件；若虚拟主机限制连接数报错，调小即可。
      - name: Deploy to host via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          command -v lftp >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          }
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST:${FTP_PORT:-21}" -e "
            set cmd:fail-exit yes;
            set ssl:verify-certificate no;
            set mirror:size-only 1;
            mirror --reverse --parallel=8 --verbose dist/ ${FTP_REMOTE_DIR:-.};
            bye
          "

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Shirone deploy"
            echo ""
            echo "- 内容仓：\`${CONTENT_REPOSITORY}\`"
            echo "- 内容 ref：\`${{ steps.target.outputs.ref }}\`"
            echo "- 内容 commit：\`${{ steps.content.outputs.sha }}\`"
            if [ -f content.lock.json ]; then
              echo ""
              echo "<details><summary>content.lock.json</summary>"
              echo ""
              echo '```json'
              cat content.lock.json
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
